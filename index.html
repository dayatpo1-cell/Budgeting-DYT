<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BudgetingKU</title>
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 min-h-screen pb-10 text-slate-800">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 text-center shadow-md font-bold text-xl">
        BudgetingKU
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Pemilih Periode Bulan -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
            <label for="monthFilter" class="text-sm font-semibold text-slate-700">Periode Bulan:</label>
            <input type="month" id="monthFilter" class="px-3 py-1.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-primary font-medium text-slate-700">
        </div>

        <!-- Form Input Pemasukan / Gaji -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
            <h2 class="font-bold text-slate-700 text-base">💰 Pemasukan Bulan Ini</h2>
            <form id="incomeForm" class="space-y-3">
                <input type="number" id="incomeInput" placeholder="Masukkan Gaji / Pemasukan" required class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-primary">
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-xl text-sm font-medium hover:bg-indigo-700 transition">Simpan Pemasukan</button>
            </form>
        </div>

        <!-- Ringkasan Saldo -->
        <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-2xl text-center space-y-1">
            <p class="text-xs font-semibold text-indigo-500 uppercase tracking-wider">Sisa Anggaran Periode Ini</p>
            <p id="remainingBudget" class="text-2xl font-extrabold text-indigo-700">Rp 0</p>
        </div>

        <!-- Form Pengeluaran / Transaksi -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
            <h2 class="font-bold text-slate-700 text-base">💸 Catat Pengeluaran</h2>
            <form id="transForm" class="space-y-3">
                <input type="text" id="transName" placeholder="Nama Transaksi (Misal: Makan)" required class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-primary">
                <input type="number" id="transAmount" placeholder="Nominal" required class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-primary">
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-xl text-sm font-medium hover:bg-indigo-700 transition">Simpan Transaksi</button>
            </form>
        </div>

        <!-- Riwayat Transaksi -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
            <h2 class="font-bold text-slate-700 text-base">📋 Riwayat Transaksi</h2>
            <div id="transList" class="space-y-2 text-sm text-slate-500">
                Belum ada catatan transaksi di bulan ini.
            </div>
        </div>

        <!-- Tagihan Rutin Bulanan -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="font-bold text-slate-700 text-base">💡 Tagihan Rutin Bulanan</h2>
            </div>
            <form id="billForm" class="space-y-3 mb-4">
                <input type="text" id="billName" placeholder="Nama Tagihan (Listrik, Wifi)" required class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-primary">
                <input type="number" id="billAmount" placeholder="Nominal" required class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-primary">
                <button type="submit" class="w-full bg-amber-600 text-white py-2 rounded-xl text-sm font-medium hover:bg-amber-700 transition">Tambah Tagihan</button>
            </form>
            <div id="billList" class="space-y-2 text-sm text-slate-500">
                Belum ada tagihan rutin.
            </div>
        </div>

    </main>

    <script>
        // Inisialisasi Service Worker untuk PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }

        // Set Default Bulan saat ini (YYYY-MM)
        const monthFilter = document.getElementById('monthFilter');
        const now = new Date();
        const currentMonthStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        monthFilter.value = currentMonthStr;

        // Ambil data dari LocalStorage
        let dataStore = JSON.parse(localStorage.getItem('budgeting_data')) || {};

        function getMonthData(monthKey) {
            if (!dataStore[monthKey]) {
                dataStore[monthKey] = { income: 0, transactions: [], bills: [] };
            }
            return dataStore[monthKey];
        }

        function saveData() {
            localStorage.setItem('budgeting_data', JSON.stringify(dataStore));
            render();
        }

        function render() {
            const monthKey = monthFilter.value;
            const currentData = getMonthData(monthKey);

            // Tampilkan Income
            document.getElementById('incomeInput').value = currentData.income || '';

            // Hitung Total Pengeluaran
            const totalTrans = currentData.transactions.reduce((acc, curr) => acc + curr.amount, 0);
            const totalBills = currentData.bills.reduce((acc, curr) => acc + curr.amount, 0);
            const remaining = currentData.income - (totalTrans + totalBills);

            document.getElementById('remainingBudget').innerText = `Rp ${remaining.toLocaleString('id-ID')}`;

            // Render Transaksi
            const transList = document.getElementById('transList');
            if (currentData.transactions.length === 0) {
                transList.innerHTML = '<p class="text-xs text-slate-400">Belum ada catatan transaksi di bulan ini.</p>';
            } else {
                transList.innerHTML = currentData.transactions.map(item => `
                    <div class="flex justify-between items-center p-2 bg-slate-50 rounded-xl border border-slate-100">
                        <span class="font-medium text-slate-700">${item.name}</span>
                        <span class="font-bold text-rose-600">- Rp ${item.amount.toLocaleString('id-ID')}</span>
                    </div>
                `).join('');
            }

            // Render Tagihan
            const billList = document.getElementById('billList');
            if (currentData.bills.length === 0) {
                billList.innerHTML = '<p class="text-xs text-slate-400">Belum ada tagihan rutin di bulan ini.</p>';
            } else {
                billList.innerHTML = currentData.bills.map(item => `
                    <div class="flex justify-between items-center p-2 bg-slate-50 rounded-xl border border-slate-100">
                        <span class="font-medium text-slate-700">${item.name}</span>
                        <span class="font-bold text-amber-600">Rp ${item.amount.toLocaleString('id-ID')}</span>
                    </div>
                `).join('');
            }
        }

        // Event Listeners
        monthFilter.addEventListener('change', render);

        document.getElementById('incomeForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const monthKey = monthFilter.value;
            dataStore[monthKey].income = Number(document.getElementById('incomeInput').value);
            saveData();
        });

        document.getElementById('transForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const monthKey = monthFilter.value;
            const name = document.getElementById('transName').value;
            const amount = Number(document.getElementById('transAmount').value);
            dataStore[monthKey].transactions.push({ name, amount });
            document.getElementById('transName').value = '';
            document.getElementById('transAmount').value = '';
            saveData();
        });

        document.getElementById('billForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const monthKey = monthFilter.value;
            const name = document.getElementById('billName').value;
            const amount = Number(document.getElementById('billAmount').value);
            dataStore[monthKey].bills.push({ name, amount });
            document.getElementById('billName').value = '';
            document.getElementById('billAmount').value = '';
            saveData();
        });

        // First Load
        render();
    </script>
</body>
</html>
