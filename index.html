    // --- UTILS & FORMATTERS ---
    function formatRupiah(amount) {
      if (isNaN(amount) || amount === null || amount === undefined) return 'Rp 0';
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        maximumFractionDigits: 0,
      }).format(amount);
    }

    function getCurrentMonthKey() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    }

    function getTodayDateString() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function formatMonthLabel(monthKey) {
      if (!monthKey || !monthKey.includes('-')) return monthKey;
      const [yearStr, monthStr] = monthKey.split('-');
      const year = parseInt(yearStr, 10);
      const month = parseInt(monthStr, 10) - 1;
      const monthNames = [
        'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
        'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember',
      ];
      return month >= 0 && month < 12 ? `${monthNames[month]} ${year}` : monthKey;
    }

    function getAdjacentMonthKey(monthKey, offset) {
      if (!monthKey || !monthKey.includes('-')) return getCurrentMonthKey();
      const [yearStr, monthStr] = monthKey.split('-');
      const year = parseInt(yearStr, 10);
      const month = parseInt(monthStr, 10) - 1;
      const date = new Date(year, month + offset, 1);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
    }

    function formatDateIndo(dateStr) {
      if (!dateStr) return '';
      try {
        const parts = dateStr.split('-');
        if (parts.length === 3) {
          const shortMonths = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
          return `${parseInt(parts[2], 10)} ${shortMonths[parseInt(parts[1], 10) - 1]} ${parts[0]}`;
        }
        return dateStr;
      } catch {
        return dateStr;
      }
    }

    // --- STORAGE HELPERS (BACKWARDS COMPATIBLE) ---
    const STORAGE_USERS_KEY = 'budgeting_users';
    const STORAGE_CURRENT_USER_KEY = 'budgeting_current_user';

    function getStoredUsers() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_USERS_KEY)) || {};
      } catch {
        return {};
      }
    }

    function saveStoredUsers(users) {
      try {
        localStorage.setItem(STORAGE_USERS_KEY, JSON.stringify(users));
      } catch (err) {
        console.error(err);
      }
    }

    function getStoredCurrentUser() {
      try {
        return localStorage.getItem(STORAGE_CURRENT_USER_KEY);
      } catch {

      }

    function setStoredCurrentUser(username) {
      try {
        if (username) localStorage.setItem(STORAGE_CURRENT_USER_KEY, username);
        else localStorage.removeItem(STORAGE_CURRENT_USER_KEY);
      } catch (err) {
        console.error(err);

    }

    function getOrCreateMonthData(store, monthKey) {
      if (store && store[monthKey]) {
        const d = store[monthKey];
        return {
          incomes: Array.isArray(d.incomes) ? d.incomes : [],
          transactions: Array.isArray(d.transactions) ? d.transactions : [],
          bills: Array.isArray(d.bills) ? d.bills : [],
          installmentPaidKeys: Array.isArray(d.installmentPaidKeys) ? d.installmentPaidKeys : [],
        };
      }
      return { incomes: [], transactions: [], bills: [], installmentPaidKeys: [] };
    }

    // --- TOAST NOTIFICATIONS ---
    function ToastContainer({ toasts, onDismiss }) {
      if (toasts.length === 0) return null;
      return (
        <div className="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4">
          {toasts.map((toast) => {
            const bgConfig = {
              success: 'bg-emerald-900/90 border-emerald-500/40 text-emerald-100',
              error: 'bg-rose-900/90 border-rose-500/40 text-rose-100',
              warning: 'bg-amber-900/90 border-amber-500/40 text-amber-100',
              info: 'bg-indigo-900/90 border-indigo-500/40 text-indigo-100',
            }[toast.type];

            return (
              <div
                key={toast.id}
                className={`pointer-events-auto flex items-start gap-3 p-3.5 rounded-2xl shadow-xl backdrop-blur-md border transition-all ${bgConfig}`}
              >
                <div className="shrink-0 mt-0.5">
                  {toast.type === 'success' && <CheckCircle2Icon className="w-5 h-5 text-emerald-400" />}
                  {toast.type === 'error' && <AlertCircleIcon className="w-5 h-5 text-rose-400" />}
                  {toast.type === 'warning' && <AlertTriangleIcon className="w-5 h-5 text-amber-400" />}
                  {toast.type === 'info' && <CheckCircle2Icon className="w-5 h-5 text-indigo-400" />}
                </div>
                <div className="flex-1 min-w-0">
                  {toast.title && <p className="text-xs font-bold leading-tight mb-0.5">{toast.title}</p>}
                  <p className="text-xs opacity-90 leading-relaxed break-words">{toast.message}</p>
                </div>
                <button
                  onClick={() => onDismiss(toast.id)}
                  className="text-white/60 hover:text-white p-1 -mr-1 -mt-1 rounded-lg"
                >
                  <XIcon className="w-3.5 h-3.5" />
                </button>
              </div>
            );
          })}
        </div>
      );
    }

    function ConfirmModal({ isOpen, title, message, confirmLabel = 'Ya, Lanjutkan', cancelLabel = 'Batal', confirmVariant = 'danger', onConfirm, onCancel }) {

      const btnVariant = {

        success: 'bg-emerald-600 hover:bg-emerald-700 text-white',

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
          <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 space-y-4">

                  <AlertCircleIcon className="w-5 h-5" />

                <h3 className="font-bold text-base text-slate-900">{title}</h3>

              <button onClick={onCancel} className="text-slate-400 hover:text-slate-600 p-1 rounded-lg">

            <p className="text-xs text-slate-600 leading-relaxed">{message}</p>

                type="button"

                className="flex-1 py-2.5 px-4 text-xs font-semibold rounded-xl border border-slate-200 text-slate-700 hover:bg-slate-50 transition"

    // --- AUTH SCREEN ---
    function AuthScreen({ onSuccess, showToast }) {
      const [isLoginMode, setIsLoginMode] = useState(true);
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [loading, setLoading] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        const cleanUser = username.trim().toLowerCase();
        if (!cleanUser || !password) {
          showToast('warning', 'Harap isi nama pengguna dan kata sandi.');
          return;
        }

        setLoading(true);
        setTimeout(() => {
          const users = getStoredUsers();
          if (isLoginMode) {
            if (!users[cleanUser] || users[cleanUser].password !== password) {
              setLoading(false);
              showToast('error', 'Nama pengguna atau kata sandi tidak cocok. Silakan periksa kembali.', 'Gagal Masuk');
              return;
            }
            setLoading(false);
            showToast('success', `Selamat datang kembali, ${cleanUser}!`, 'Berhasil Masuk');
            onSuccess(cleanUser);
          } else {
            if (users[cleanUser]) {
              setLoading(false);
              showToast('warning', 'Nama pengguna sudah terdaftar. Silakan pilih nama lain atau masuk.', 'Sudah Ada');
              return;
            }
            users[cleanUser] = { password, createdAt: new Date().toISOString() };
            saveStoredUsers(users);
            setLoading(false);
            showToast('success', 'Akun berhasil didaftarkan! Silakan masuk.', 'Pendaftaran Sukses');
            setIsLoginMode(true);
          }
        }, 200);
      };

    // --- MONTHLY BILLS SECTION ---
    function MonthlyBillsSection({ bills, onAddBill, onToggleBillPaid, onDeleteBill, onCopyPreviousMonthBills, onResetBills }) {
      const [name, setName] = useState('');
      const [amount, setAmount] = useState('');
      const [dueDate, setDueDate] = useState('');
      const [isFormOpen, setIsFormOpen] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        const num = parseFloat(amount.replace(/[^0-9]/g, ''));
        if (!name.trim() || isNaN(num) || num <= 0) return;
        onAddBill({ name: name.trim(), amount: num, dueDate: dueDate.trim() || undefined });
        setName('');
        setAmount('');
        setDueDate('');
        setIsFormOpen(false);
      };

      const totalBills = bills.reduce((sum, b) => sum + b.amount, 0);
      const paidBillsCount = bills.filter((b) => b.paid).length;
      const paidBillsAmount = bills.filter((b) => b.paid).reduce((sum, b) => sum + b.amount, 0);
      const progressPercent = bills.length > 0 ? Math.round((paidBillsCount / bills.length) * 100) : 0;

      return (
        <div className="space-y-4">
          <div className="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200/80 space-y-3">
            <div className="flex items-center justify-between">
              <h2 className="font-bold text-slate-800 text-base flex items-center gap-2">
                <span>📄</span>
                <span>Tambah Tagihan Rutin Bulanan</span>
              </h2>
              <button
                onClick={() => setIsFormOpen(!isFormOpen)}
                className="text-xs font-semibold px-2.5 py-1.5 rounded-xl bg-indigo-50 text-indigo-700 hover:bg-indigo-100 transition flex items-center gap-1"
              >
                <PlusCircleIcon className="w-3.5 h-3.5" />
                <span>{isFormOpen ? 'Tutup' : 'Tambah'}</span>
              </button>
            </div>

            {isFormOpen && (
              <form onSubmit={handleSubmit} className="p-3.5 bg-indigo-50/40 rounded-2xl border border-indigo-100 space-y-3">
                <div>
                  <label className="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Nama Tagihan</label>
                  <input
                    type="text"
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    placeholder="Misal: Listrik PLN, WiFi IndiHome, Kost, BPJS"
                    required
                    className="w-full px-3 py-2 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-indigo-500 font-medium"
                  />
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                  <div>
                    <label className="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Nominal Tagihan (Rp)</label>
                    <input
                      type="number"
                      value={amount}
                      onChange={(e) => setAmount(e.target.value)}
                      placeholder="Contoh: 350000"
                      required
                      min="1"
                      className="w-full px-3 py-2 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-indigo-500 font-medium"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Jatuh Tempo (Opsional)</label>
                    <input
                      type="text"
                      value={dueDate}
                      onChange={(e) => setDueDate(e.target.value)}
                      placeholder="Misal: Tgl 10 tiap bulan"
                      className="w-full px-3 py-2 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-indigo-500 font-medium text-slate-700"
                    />
                  </div>
                </div>
                <div className="flex gap-2 pt-1">
                  <button
                    type="button"
                    onClick={() => setIsFormOpen(false)}
                    className="px-3 py-2 text-xs font-semibold text-slate-500 hover:bg-slate-100 rounded-xl transition"
                  >
                    Batal
                  </button>
                  <button
                    type="submit"
                    className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl text-xs font-bold transition shadow-sm flex items-center justify-center gap-1.5"
                  >
                    <PlusCircleIcon className="w-4 h-4" />
                    <span>Tambah ke Daftar Tagihan</span>
                  </button>
                </div>
              </form>
            )}
          </div>

          <div className="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200/80 space-y-3.5">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div>
                <h2 className="font-bold text-slate-800 text-base leading-tight">Checklist Tagihan Bulan Ini</h2>
                <p className="text-[11px] text-slate-400">Centang kotak untuk menandai Lunas</p>
              </div>
              <div className="flex items-center gap-1.5">
                <button
                  onClick={onCopyPreviousMonthBills}
                  className="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-2.5 py-1.5 rounded-xl font-semibold transition flex items-center gap-1 shadow-2xs"
                  title="Salin tagihan rutin dari bulan sebelumnya"
                >
                  <CopyIcon className="w-3.5 h-3.5" />
                  <span>Salin Bulan Lalu</span>
                </button>
                {bills.length > 0 && (
                  <button
                    onClick={onResetBills}
                    className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-2.5 py-1.5 rounded-xl font-medium transition flex items-center gap-1"
                    title="Reset status lunas semua tagihan bulan ini"
                  >
                    <RotateCcwIcon className="w-3 h-3" />
                    <span>Reset</span>
                  </button>
                )}
              </div>
            </div>

            {bills.length > 0 && (
              <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100 space-y-1.5">
                <div className="flex justify-between items-center text-[11px] font-medium text-slate-600">
                  <span>Status Lunas: <strong>{paidBillsCount}</strong> dari {bills.length} tagihan ({progressPercent}%)</span>
                  <span>Terbayar: <strong className="text-emerald-600">{formatRupiah(paidBillsAmount)}</strong> / {formatRupiah(totalBills)}</span>
                </div>
                <div className="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
                  <div className="bg-emerald-500 h-full rounded-full transition-all duration-300" style={{ width: `${progressPercent}%` }} />
                </div>
              </div>
            )}

            <div className="space-y-2.5 pt-1">
              {bills.length === 0 ? (
                <div className="p-4 text-center rounded-2xl bg-slate-50 border border-dashed border-slate-200 space-y-1">
                  <p className="text-xs text-slate-400 font-medium">Belum ada tagihan rutin di bulan ini.</p>
                  <p className="text-[10px] text-slate-400">Gunakan "Salin Bulan Lalu" atau tambahkan melalui formulir di atas.</p>
                </div>
              ) : (
                bills.map((item, index) => (
                  <div
                    key={item.id || index}
                    className={`flex items-center justify-between p-3.5 rounded-2xl border transition-all ${
                      item.paid ? 'bg-emerald-50/70 border-emerald-200 shadow-2xs' : 'bg-white border-slate-200 hover:border-slate-300 shadow-xs'
                    }`}
                  >
                    <div className="flex items-center gap-3 min-w-0 pr-2">
                      <button
                        type="button"
                        onClick={() => onToggleBillPaid(index)}
                        className="focus:outline-none transition active:scale-95"
                      >
                        {item.paid ? (
                          <CheckSquareIcon className="w-5 h-5 text-indigo-600" />
                        ) : (
                          <SquareIcon className="w-5 h-5 text-slate-300 hover:text-indigo-500" />
                        )}
                      </button>

                      <div className="min-w-0">
                        <p className={`font-bold text-sm truncate transition ${item.paid ? 'line-through text-slate-400' : 'text-slate-800'}`}>
                          {item.name}
                        </p>
                        <div className="flex items-center gap-2 mt-0.5">
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1 ${
                            item.paid ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'
                          }`}>
                            {item.paid ? '✓ Sudah Lunas' : 'Belum Dibayar'}
                          </span>
                          {item.dueDate && <span className="text-[10px] text-slate-400">{item.dueDate}</span>}
                        </div>
                      </div>
                    </div>

                    <div className="flex items-center gap-2 shrink-0">
                      <span className={`font-extrabold text-sm ${item.paid ? 'text-slate-400 line-through' : 'text-slate-700'}`}>
                        {formatRupiah(item.amount)}
                      </span>
                      <button
                        type="button"
                        onClick={() => onDeleteBill(index)}
                        className="text-slate-400 hover:text-rose-500 hover:bg-rose-50 p-1.5 rounded-lg transition"
                        title="Hapus tagihan"
                      >
                        <Trash2Icon className="w-3.5 h-3.5" />
                      </button>
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- INSTALLMENTS SECTION ---
    function InstallmentsSection({ installments, installmentPaidKeys, onAddInstallment, onToggleInstallmentPaid, onDeleteInstallment }) {
      const [name, setName] = useState('');
      const [amount, setAmount] = useState('');
      const [tenor, setTenor] = useState('');
      const [isFormOpen, setIsFormOpen] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        const num = parseFloat(amount.replace(/[^0-9]/g, ''));
        const ten = parseInt(tenor, 10);
        if (!name.trim() || isNaN(num) || num <= 0 || isNaN(ten) || ten <= 0) return;
        onAddInstallment({ name: name.trim(), amount: num, tenor: ten });
        setName('');
        setAmount('');
        setTenor('');
        setIsFormOpen(false);
      };

      const handlePay = (index, inst, isPaidThisMonth) => {
        if (!isPaidThisMonth && (inst.paidMonths + 1) >= inst.tenor) {
          try {
            if (window.confetti) {
              window.confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
            }
          } catch {}
        }
        onToggleInstallmentPaid(index);
      };

      const totalMonthly = installments.reduce((s, i) => s + i.amount, 0);

      return (
        <div className="space-y-4">
          <div className="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200/80 space-y-3">
            <div className="flex items-center justify-between">
              <h2 className="font-bold text-slate-800 text-base flex items-center gap-2">
                <span>⏱️</span>
                <span>Tambah Cicilan Berjangka (Tenor)</span>
              </h2>
              <button
                onClick={() => setIsFormOpen(!isFormOpen)}
                className="text-xs font-semibold px-2.5 py-1.5 rounded-xl bg-indigo-50 text-indigo-700 hover:bg-indigo-100 transition flex items-center gap-1"
              >
                <PlusCircleIcon className="w-3.5 h-3.5" />
                <span>{isFormOpen ? 'Tutup' : 'Tambah'}</span>
              </button>
            </div>

            {isFormOpen && (
              <form onSubmit={handleSubmit} className="p-3.5 bg-indigo-50/40 rounded-2xl border border-indigo-100 space-y-3">
                <div>
                  <label className="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Nama Barang / Tagihan</label>
                  <input
                    type="text"
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    placeholder="Contoh: Smartphone, Laptop, Motor, Kulkas"
                    required
                    className="w-full px-3 py-2 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-indigo-500 font-medium"
                  />
                </div>
                <div className="grid grid-cols-2 gap-2.5">
                  <div>
                    <label className="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Nominal / Bulan (Rp)</label>
                    <input
                      type="number"
                      value={amount}
                      onChange={(e) => setAmount(e.target.value)}
                      placeholder="500000"
                      required
                      min="1"
                      className="w-full px-3 py-2 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-indigo-500 font-medium"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Total Tenor (Bulan)</label>
                    <input
                      type="number"
                      value={tenor}
                      onChange={(e) => setTenor(e.target.value)}
                      placeholder="6"
                      required
                      min="1"
                      max="120"
                      className="w-full px-3 py-2 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-indigo-500 font-medium"
                    />
                  </div>
                </div>
                <div className="flex gap-2 pt-1">
                  <button
                    type="button"
                    onClick={() => setIsFormOpen(false)}
                    className="px-3 py-2 text-xs font-semibold text-slate-500 hover:bg-slate-100 rounded-xl transition"
                  >
                    Batal
                  </button>
                  <button
                    type="submit"
                    className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl text-xs font-bold transition shadow-sm flex items-center justify-center gap-1.5"
                  >
                    <PlusCircleIcon className="w-4 h-4" />
                    <span>Simpan Tracker Cicilan</span>
                  </button>
                </div>
              </form>
            )}
          </div>

          <div className="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200/80 space-y-3.5">
            <div className="flex items-center justify-between">
              <div>
                <h2 className="font-bold text-slate-800 text-base leading-tight">Daftar Tracker Cicilan</h2>
                <p className="text-[11px] text-slate-400">Pantau progres tenor dan klik tombol bayar bulanan</p>
              </div>
              {installments.length > 0 && (
                <span className="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-xl font-bold">
                  {formatRupiah(totalMonthly)} /bln
                </span>
              )}
            </div>

            <div className="space-y-3 pt-1">
              {installments.length === 0 ? (
                <div className="p-4 text-center rounded-2xl bg-slate-50 border border-dashed border-slate-200 space-y-1">
                  <p className="text-xs text-slate-400 font-medium">Belum ada cicilan berjangka yang dicatat.</p>
                </div>
              ) : (
                installments.map((inst, index) => {
                  const isPaidThisMonth = installmentPaidKeys.includes(index);
                  const paidMonths = inst.paidMonths || 0;
                  const remainingMonths = Math.max(0, inst.tenor - paidMonths);
                  const remainingAmount = remainingMonths * inst.amount;
                  const progressPercent = Math.min(100, Math.round((paidMonths / inst.tenor) * 100));
                  const isFullyPaid = paidMonths >= inst.tenor;
                  const currentStep = Math.min(inst.tenor, paidMonths + (isPaidThisMonth ? 0 : 1));

                  return (
                    <div
                      key={inst.id || index}
                      className={`p-4 rounded-2xl border space-y-3 transition-all shadow-xs ${
                        isFullyPaid
                          ? 'bg-emerald-50/50 border-emerald-200'
                          : isPaidThisMonth
                          ? 'bg-indigo-50/30 border-indigo-200'
                          : 'bg-white border-slate-200 hover:border-slate-300'
                      }`}
                    >
                      <div className="flex justify-between items-start gap-2">
                        <div className="min-w-0">
                          <div className="flex items-center gap-2 flex-wrap">
                            <p className="font-bold text-slate-900 text-sm truncate">{inst.name}</p>
                            {isFullyPaid ? (
                              <span className="text-[10px] font-black bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full flex items-center gap-1">
                                <AwardIcon className="w-3 h-3 text-emerald-600" />
                                Lunas Sepenuhnya
                              </span>
                            ) : (
                              <span className="text-[10px] font-bold bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-full">
                                Cicilan ke-{currentStep} dari {inst.tenor}
                              </span>
                            )}
                          </div>
                          <p className="text-xs text-slate-500 mt-1">
                            {formatRupiah(inst.amount)} /bln • Sisa:{' '}
                            <b className={isFullyPaid ? 'text-emerald-700' : 'text-rose-600'}>
                              {isFullyPaid ? 'Rp 0 (Selesai)' : formatRupiah(remainingAmount)}
                            </b>
                          </p>
                        </div>
                        <button
                          type="button"
                          onClick={() => onDeleteInstallment(index)}
                          className="text-slate-400 hover:text-rose-500 hover:bg-rose-50 p-1.5 rounded-lg transition shrink-0"
                          title="Hapus"
                        >
                          <Trash2Icon className="w-3.5 h-3.5" />
                        </button>
                      </div>

                      <div className="space-y-1.5">
                        <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                          <div
                            className={`h-full rounded-full transition-all duration-500 ${isFullyPaid ? 'bg-emerald-500' : 'bg-indigo-600'}`}
                            style={{ width: `${progressPercent}%` }}
                          />
                        </div>
                        <div className="flex justify-between text-[11px] text-slate-400 font-medium">
                          <span>Progres: <strong className="text-slate-700">{progressPercent}%</strong></span>
                          <span>
                            {isFullyPaid ? (
                              <span className="text-emerald-600 font-bold">Semua {inst.tenor} bulan telah lunas</span>
                            ) : (
                              <>Sisa: <strong className="text-slate-700">{remainingMonths} bulan</strong></>
                            )}
                          </span>
                        </div>
                      </div>

                      {!isFullyPaid ? (
                        <button
                          type="button"
                          onClick={() => handlePay(index, inst, isPaidThisMonth)}
                          className={`w-full py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 cursor-pointer shadow-xs ${
                            isPaidThisMonth
                              ? 'bg-emerald-100 text-emerald-800 hover:bg-emerald-200'
                              : 'bg-emerald-600 text-white hover:bg-emerald-700'
                          }`}
                        >
                          {isPaidThisMonth ? (
                            <>
                              <CheckCircle2Icon className="w-3.5 h-3.5 text-emerald-600" />
                              <span>✓ Sudah Dibayar Bulan Ini (Klik untuk Batal)</span>
                            </>
                          ) : (
                            <>
                              <span className="w-2 h-2 rounded-full bg-white animate-pulse" />
                              <span>🟢 Bayar Cicilan Bulan Ini</span>
                            </>
                          )}
                        </button>
                      ) : (
                        <div className="p-2 bg-emerald-50 rounded-xl text-center text-xs font-semibold text-emerald-700 border border-emerald-100 flex items-center justify-center gap-1.5">
                          <AwardIcon className="w-4 h-4 text-emerald-600" />
                          <span>Selamat! Cicilan barang ini sudah selesai lunas.</span>
                        </div>
                      )}
                    </div>
                  );
                })
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- EXPORT / BACKUP MODAL ---
    function ExportModal({ isOpen, onClose, username, monthKey, dataStore, installments, onImportData, showToast }) {
      const [activeTab, setActiveTab] = useState('backup');
      const [importJson, setImportJson] = useState('');
      const [copied, setCopied] = useState(false);

      if (!isOpen) return null;

      const currentMonthData = dataStore[monthKey] || { incomes: [], transactions: [], bills: [], installmentPaidKeys: [] };
      const totalIncomes = currentMonthData.incomes.reduce((a, b) => a + b.amount, 0);
      const totalTrans = currentMonthData.transactions.reduce((a, b) => a + b.amount, 0);
      const totalBills = currentMonthData.bills.reduce((a, b) => a + b.amount, 0);
      const totalInstallments = installments.reduce((a, b) => a + b.amount, 0);
      const totalExpenses = totalTrans + totalBills + totalInstallments;
      const remaining = totalIncomes - totalExpenses;

      const exportPayload = {
        app: 'BudgetingKU',
        version: '2.0',
        exportedAt: new Date().toISOString(),
        username: username,
        dataStore: dataStore,
        installments: installments,
      };

      const jsonString = JSON.stringify(exportPayload, null, 2);

      const handleDownloadJSON = () => {
        try {
          const blob = new Blob([jsonString], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `budgetingku-backup-${username}-${new Date().toISOString().slice(0, 10)}.json`;
          a.click();
          URL.revokeObjectURL(url);
          showToast('success', 'File cadangan JSON berhasil diunduh.');
        } catch {
          showToast('error', 'Gagal mengunduh file.');
        }
      };

      const handleDownloadHTML = () => {
        try {
          const htmlContent = document.documentElement.outerHTML;
          const blob = new Blob([htmlContent], { type: 'text/html' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'index.html';
          a.click();
          URL.revokeObjectURL(url);
          showToast('success', 'File index.html tunggal siap pakai berhasil diunduh!');
        } catch {
          showToast('error', 'Gagal mengunduh file HTML.');
        }
      };

      const handleCopy = () => {
        try {
          navigator.clipboard.writeText(jsonString);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
          showToast('info', 'Teks JSON telah disalin.');
        } catch {
          showToast('error', 'Gagal menyalin teks.');
        }
      };

      const handleImport = (e) => {
        e.preventDefault();
        try {
          const parsed = JSON.parse(importJson.trim());
          const store = parsed.dataStore || parsed;
          const insts = parsed.installments || [];
          onImportData(store, insts);
          setImportJson('');
          showToast('success', 'Data berhasil dipulihkan!');
          onClose();
        } catch {
          showToast('error', 'Format JSON tidak valid.');
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
          <div className="bg-white rounded-3xl max-w-lg w-full max-h-[90vh] flex flex-col shadow-2xl border border-slate-100 overflow-hidden">
            <div className="p-4 sm:p-5 border-b border-slate-100 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <div className="p-2 bg-indigo-50 text-indigo-600 rounded-xl">
                  <DownloadIcon className="w-5 h-5" />
                </div>
                <div>
                  <h3 className="font-bold text-slate-800 text-base">Cadangkan & Laporan Finansial</h3>
                  <p className="text-xs text-slate-400">Pengguna: {username}</p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                <XIcon className="w-5 h-5" />
              </button>
            </div>

            <div className="flex px-4 pt-3 border-b border-slate-100 gap-2">
              <button
                onClick={() => setActiveTab('backup')}
                className={`pb-2.5 px-3 text-xs font-bold border-b-2 transition ${
                  activeTab === 'backup' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-400 hover:text-slate-600'
                }`}
              >
                Cadangkan & Pulihkan
              </button>
              <button
                onClick={() => setActiveTab('report')}
                className={`pb-2.5 px-3 text-xs font-bold border-b-2 transition ${
                  activeTab === 'report' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-400 hover:text-slate-600'
                }`}
              >
                Ringkasan {formatMonthLabel(monthKey)}
              </button>
            </div>

            <div className="p-4 sm:p-5 overflow-y-auto space-y-4 flex-1">
              {activeTab === 'backup' ? (
                <div className="space-y-4">
                  {/* Download single-file HTML for GitHub */}
                  <div className="bg-indigo-50/70 p-4 rounded-2xl border border-indigo-100 space-y-2">
                    <h4 className="text-xs font-bold text-indigo-900 flex items-center gap-1.5">
                      <DownloadIcon className="w-4 h-4 text-indigo-600" />
                      <span>Unduh File index.html Tunggal (Untuk GitHub)</span>
                    </h4>
                    <p className="text-[11px] text-indigo-700 leading-relaxed">
                      Unduh langsung file <strong>index.html</strong> mandiri ini untuk diunggah ke repository GitHub Anda (GitHub Pages).
                    </p>
                    <button
                      onClick={handleDownloadHTML}
                      className="w-full py-2 px-3 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl transition flex items-center justify-center gap-1.5 shadow-sm"
                    >
                      <DownloadIcon className="w-4 h-4" />
                      <span>Unduh index.html untuk GitHub</span>
                    </button>
                  </div>

                  {/* JSON Backup */}
                  <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200/80 space-y-3">
                    <div>
                      <h4 className="text-xs font-bold text-slate-700">Ekspor Data Keuangan (JSON)</h4>
                      <p className="text-[11px] text-slate-400">Unduh data Anda untuk dicadangkan atau dipindahkan.</p>
                    </div>
                    <div className="flex gap-2">
                      <button
                        onClick={handleDownloadJSON}
                        className="flex-1 py-2 px-3 bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold rounded-xl transition flex items-center justify-center gap-1.5 shadow-xs"
                      >
                        <DownloadIcon className="w-4 h-4" />
                        <span>Unduh File .JSON</span>
                      </button>
                      <button
                        onClick={handleCopy}
                        className="py-2 px-3 bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 text-xs font-semibold rounded-xl transition flex items-center gap-1.5"
                      >
                        {copied ? <CheckIcon className="w-4 h-4 text-emerald-600" /> : <CopyIcon className="w-4 h-4" />}
                        <span>{copied ? 'Tersalin' : 'Salin JSON'}</span>
                      </button>
                    </div>
                  </div>

                  {/* JSON Restore */}
                  <form onSubmit={handleImport} className="bg-slate-50 p-4 rounded-2xl border border-slate-200/80 space-y-3">
                    <div>
                      <h4 className="text-xs font-bold text-slate-700">Pulihkan dari Cadangan</h4>
                      <p className="text-[11px] text-slate-400">Tempelkan teks JSON untuk memulihkan seluruh data Anda.</p>
                    </div>
                    <textarea
                      value={importJson}
                      onChange={(e) => setImportJson(e.target.value)}
                      placeholder='Tempel teks JSON di sini...'
                      rows={3}
                      className="w-full p-2.5 text-xs font-mono bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-indigo-500"
                    />
                    <button
                      type="submit"
                      disabled={!importJson.trim()}
                      className="w-full py-2 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white text-xs font-bold rounded-xl transition flex items-center justify-center gap-1.5 shadow-xs"
                    >
                      <UploadIcon className="w-4 h-4" />
                      <span>Pulihkan Data Sekarang</span>
                    </button>
                  </form>
                </div>
              ) : (
                <div className="space-y-3 bg-slate-50 p-4 rounded-2xl border border-slate-200 text-xs">
                  <div className="text-center pb-2 border-b border-slate-200">
                    <h4 className="font-extrabold text-sm text-slate-800">Laporan Ringkasan Finansial</h4>
                    <p className="text-[11px] text-slate-500">Periode: {formatMonthLabel(monthKey)}</p>
                  </div>
                  <div className="space-y-1.5 text-slate-600">
                    <div className="flex justify-between py-1 border-b border-slate-200/60">
                      <span>Dana Masuk (Pemasukan)</span>
                      <span className="font-bold text-emerald-600">{formatRupiah(totalIncomes)}</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-slate-200/60">
                      <span>Pengeluaran Harian</span>
                      <span className="font-bold text-rose-600">{formatRupiah(totalTrans)}</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-slate-200/60">
                      <span>Tagihan Rutin Bulanan</span>
                      <span className="font-bold text-rose-600">{formatRupiah(totalBills)}</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-slate-200/60">
                      <span>Komitmen Cicilan Tenor</span>
                      <span className="font-bold text-rose-600">{formatRupiah(totalInstallments)}</span>
                    </div>
                    <div className="flex justify-between py-1.5 border-t border-slate-300 font-bold text-slate-800 text-sm">
                      <span>Sisa Saldo Bersih</span>
                      <span className={remaining < 0 ? 'text-rose-600' : 'text-indigo-600'}>
                        {formatRupiah(remaining)}
                      </span>
                    </div>
                  </div>
                </div>
              )}
            </div>

            <div className="p-4 border-t border-slate-100 flex justify-end">
              <button onClick={onClose} className="px-4 py-2 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-xl transition">
                Tutup
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- MAIN APP ROOT ---
    function App() {
      const [currentUser, setCurrentUser] = useState(() => getStoredCurrentUser());
      const [currentMonthKey, setCurrentMonthKey] = useState(() => getCurrentMonthKey());
      const [dataStore, setDataStore] = useState({});
      const [installments, setInstallments] = useState([]);
      const [toasts, setToasts] = useState([]);
      const [isExportOpen, setIsExportOpen] = useState(false);

      const [confirmModal, setConfirmModal] = useState({
        isOpen: false,
        title: '',
        message: '',
        confirmLabel: 'Ya, Lanjutkan',
        confirmVariant: 'danger',
        onConfirm: () => {},
      });

      const showToast = useCallback((type, message, title) => {
        const id = `${Date.now()}-${Math.random()}`;
        setToasts((prev) => [...prev, { id, type, message, title }]);
        setTimeout(() => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        }, 3500);
      }, []);

      const dismissToast = (id) => {
        setToasts((prev) => prev.filter((t) => t.id !== id));
      };

      useEffect(() => {
        if (currentUser) {
          setDataStore(getUserMonthDataStore(currentUser));
          setInstallments(getUserInstallments(currentUser));
        } else {
          setDataStore({});
          setInstallments([]);
        }
      }, [currentUser]);

      const updateDataStore = (newStore) => {
        setDataStore(newStore);
        if (currentUser) saveUserMonthDataStore(currentUser, newStore);
      };

      const updateInstallments = (newInsts) => {
        setInstallments(newInsts);
        if (currentUser) saveUserInstallments(currentUser, newInsts);
      };

      const handleLoginSuccess = (user) => {
        setStoredCurrentUser(user);
        setCurrentUser(user);
      };

      const handleLogout = () => {
        setConfirmModal({
          isOpen: true,
          title: 'Keluar dari Akun',
          message: 'Apakah Anda yakin ingin keluar dari sesi BudgetingKU saat ini?',
          confirmLabel: 'Keluar',
          confirmVariant: 'danger',
          onConfirm: () => {
            setStoredCurrentUser(null);
            setCurrentUser(null);
            setConfirmModal((prev) => ({ ...prev, isOpen: false }));
            showToast('info', 'Anda telah keluar dari aplikasi.');
          },
        });
      };

      const currentMonthData = getOrCreateMonthData(dataStore, currentMonthKey);

      // Incomes
      const handleAddIncome = (income) => {
        const newItem = { ...income, id: `inc-${Date.now()}` };
        updateDataStore({
          ...dataStore,
          [currentMonthKey]: {
            ...currentMonthData,
            incomes: [newItem, ...currentMonthData.incomes],
          },
        });
        showToast('success', `Pemasukan "${newItem.name}" dicatat.`);
      };

      const handleDeleteIncome = (index) => {
        const item = currentMonthData.incomes[index];
        setConfirmModal({
          isOpen: true,
          title: 'Hapus Pemasukan',
          message: `Hapus pemasukan "${item?.name}"?`,
          confirmLabel: 'Hapus',
          confirmVariant: 'danger',
          onConfirm: () => {
            const next = [...currentMonthData.incomes];
            next.splice(index, 1);
            updateDataStore({
              ...dataStore,
              [currentMonthKey]: { ...currentMonthData, incomes: next },
            });
            setConfirmModal((prev) => ({ ...prev, isOpen: false }));
            showToast('info', 'Pemasukan telah dihapus.');
          },
        });
      };

      // Transactions
      const handleAddTransaction = (tx) => {
        const newItem = { ...tx, id: `tx-${Date.now()}` };
        updateDataStore({
          ...dataStore,
          [currentMonthKey]: {
            ...currentMonthData,
            transactions: [newItem, ...currentMonthData.transactions],
          },
        });
        showToast('success', `Pengeluaran "${newItem.name}" dicatat.`);
      };

      const handleDeleteTransaction = (index) => {
        const item = currentMonthData.transactions[index];
        setConfirmModal({
          isOpen: true,
          title: 'Hapus Transaksi',
          message: `Hapus catatan pengeluaran "${item?.name}"?`,
          confirmLabel: 'Hapus',
          confirmVariant: 'danger',
          onConfirm: () => {
            const next = [...currentMonthData.transactions];
            next.splice(index, 1);
            updateDataStore({
              ...dataStore,
              [currentMonthKey]: { ...currentMonthData, transactions: next },
            });
            setConfirmModal((prev) => ({ ...prev, isOpen: false }));
            showToast('info', 'Transaksi telah dihapus.');
          },
        });
      };

      // Bills
      const handleAddBill = (bill) => {
        const newItem = { ...bill, id: `bill-${Date.now()}`, paid: false };
        updateDataStore({
          ...dataStore,
          [currentMonthKey]: {
            ...currentMonthData,
            bills: [...currentMonthData.bills, newItem],
          },
        });
        showToast('success', `Tagihan "${newItem.name}" ditambahkan.`);
      };

      const handleToggleBillPaid = (index) => {
        const next = [...currentMonthData.bills];
        if (!next[index]) return;
        const isPaid = !next[index].paid;
        next[index] = { ...next[index], paid: isPaid };
        updateDataStore({
          ...dataStore,
          [currentMonthKey]: { ...currentMonthData, bills: next },
        });
        if (isPaid) showToast('success', `Tagihan "${next[index].name}" ditandai Lunas.`);
      };

      const handleDeleteBill = (index) => {
        const item = currentMonthData.bills[index];
        setConfirmModal({
          isOpen: true,
          title: 'Hapus Tagihan',
          message: `Hapus tagihan "${item?.name}"?`,
          confirmLabel: 'Hapus',
          confirmVariant: 'danger',
          onConfirm: () => {
            const next = [...currentMonthData.bills];
            next.splice(index, 1);
            updateDataStore({
              ...dataStore,
              [currentMonthKey]: { ...currentMonthData, bills: next },
            });
            setConfirmModal((prev) => ({ ...prev, isOpen: false }));
            showToast('info', 'Tagihan telah dihapus.');
          },
        });
      };

      const handleCopyPreviousMonthBills = () => {
        const prevKey = getAdjacentMonthKey(currentMonthKey, -1);
        const prevData = dataStore[prevKey];
        if (!prevData || !prevData.bills || prevData.bills.length === 0) {
          showToast('warning', `Tidak ada data tagihan rutin di bulan sebelumnya (${formatMonthLabel(prevKey)}).`, 'Salin Gagal');
          return;
        }

        const copied = prevData.bills.map((b) => ({
          id: `bill-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`,
          name: b.name,
          amount: b.amount,
          dueDate: b.dueDate,
          paid: false,
        }));

        setConfirmModal({
          isOpen: true,
          title: 'Salin Tagihan Bulan Lalu',
          message: `Salin ${copied.length} tagihan dari ${formatMonthLabel(prevKey)} ke bulan ini?`,
          confirmLabel: 'Salin Sekarang',
          confirmVariant: 'primary',
          onConfirm: () => {
            updateDataStore({
              ...dataStore,
              [currentMonthKey]: {
                ...currentMonthData,
                bills: [...currentMonthData.bills, ...copied],
              },
            });
            setConfirmModal((prev) => ({ ...prev, isOpen: false }));
            showToast('success', `Berhasil menyalin ${copied.length} tagihan dari ${formatMonthLabel(prevKey)}!`);
          },
        });
      };

      const handleResetBills = () => {
        if (currentMonthData.bills.length === 0) return;
        setConfirmModal({
          isOpen: true,
          title: 'Reset Checklist Tagihan',
          message: 'Setel ulang status semua tagihan di bulan ini menjadi Belum Dibayar?',
          confirmLabel: 'Reset Status',
          confirmVariant: 'danger',
          onConfirm: () => {
            const next = currentMonthData.bills.map((b) => ({ ...b, paid: false }));
            updateDataStore({
              ...dataStore,
              [currentMonthKey]: { ...currentMonthData, bills: next },
            });
            setConfirmModal((prev) => ({ ...prev, isOpen: false }));
            showToast('info', 'Status tagihan bulan ini telah direset.');
          },
        });
      };

      // Installments
      const handleAddInstallment = (item) => {
        const newItem = {
          ...item,
          id: `inst-${Date.now()}`,
          paidMonths: 0,
          createdAt: new Date().toISOString(),
        };
        updateInstallments([...installments, newItem]);
        showToast('success', `Tracker cicilan "${newItem.name}" dibuat.`);
      };

      const handleToggleInstallmentPaid = (index) => {
        const inst = installments[index];
        if (!inst) return;

        const currentPaidKeys = [...(currentMonthData.installmentPaidKeys || [])];
        const keyIndex = currentPaidKeys.indexOf(index);
        const nextInsts = [...installments];

        if (keyIndex > -1) {
          currentPaidKeys.splice(keyIndex, 1);
          if (inst.paidMonths > 0) {
            nextInsts[index] = { ...inst, paidMonths: inst.paidMonths - 1 };
          }
          showToast('info', `Pembayaran cicilan "${inst.name}" bulan ini dibatalkan.`);
        } else {
          if (inst.paidMonths < inst.tenor) {
            currentPaidKeys.push(index);
            const nextPaid = inst.paidMonths + 1;
            nextInsts[index] = { ...inst, paidMonths: nextPaid };
            showToast('success', `Cicilan "${inst.name}" ke-${nextPaid} berhasil dibayar bulan ini!`);
          }
        }

        updateInstallments(nextInsts);
        updateDataStore({
          ...dataStore,
          [currentMonthKey]: {
            ...currentMonthData,
            installmentPaidKeys: currentPaidKeys,
          },
        });
      };

      const handleDeleteInstallment = (index) => {
        const inst = installments[index];
        setConfirmModal({
          isOpen: true,
          title: 'Hapus Tracker Cicilan',
          message: `Hapus tracker cicilan "${inst?.name}"?`,
          confirmLabel: 'Hapus',
          confirmVariant: 'danger',
          onConfirm: () => {
            const next = [...installments];
            next.splice(index, 1);
            const nextPaidKeys = (currentMonthData.installmentPaidKeys || []).filter((k) => k !== index);
            updateInstallments(next);
            updateDataStore({
              ...dataStore,
              [currentMonthKey]: { ...currentMonthData, installmentPaidKeys: nextPaidKeys },
            });
            setConfirmModal((prev) => ({ ...prev, isOpen: false }));
            showToast('info', 'Tracker cicilan telah dihapus.');
          },
        });
      };

      const handleLoadDemo = () => {
        if (!currentUser) return;
        setConfirmModal({
          isOpen: true,
          title: 'Muat Contoh Data',
          message: 'Muat data contoh pemasukan, pengeluaran, tagihan, dan cicilan?',
          confirmLabel: 'Muat Contoh Data',
          confirmVariant: 'primary',
          onConfirm: () => {
            const { store, installments: demoInsts } = seedDemoData(currentUser);
            setDataStore(store);
            setInstallments(demoInsts);
            setConfirmModal((prev) => ({ ...prev, isOpen: false }));
            showToast('success', 'Contoh data berhasil dimuat!');
          },
        });
      };

      const handleImportData = (newStore, newInsts) => {
        updateDataStore(newStore);
        updateInstallments(newInsts);
      };

      // Totals
      const totalIncomes = currentMonthData.incomes.reduce((a, b) => a + b.amount, 0);
      const totalTrans = currentMonthData.transactions.reduce((a, b) => a + b.amount, 0);
      const totalBills = currentMonthData.bills.reduce((a, b) => a + b.amount, 0);
      const totalInstallments = installments.reduce((a, b) => a + b.amount, 0);
      const paidBillsTotal = currentMonthData.bills.filter((b) => b.paid).reduce((a, b) => a + b.amount, 0);
      const paidInstallmentsTotal = installments.reduce((acc, curr, idx) => {
        return (currentMonthData.installmentPaidKeys || []).includes(idx) ? acc + curr.amount : acc;
      }, 0);

      if (!currentUser) {
        return (
          <React.Fragment>
            <ToastContainer toasts={toasts} onDismiss={dismissToast} />
            <AuthScreen onSuccess={handleLoginSuccess} showToast={showToast} />
          </React.Fragment>
        );
      }

      return (
        <div className="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between">
          <ToastContainer toasts={toasts} onDismiss={dismissToast} />

          <ConfirmModal
            isOpen={confirmModal.isOpen}
            title={confirmModal.title}
            message={confirmModal.message}
            confirmLabel={confirmModal.confirmLabel}
            confirmVariant={confirmModal.confirmVariant}
            onConfirm={confirmModal.onConfirm}
            onCancel={() => setConfirmModal((prev) => ({ ...prev, isOpen: false }))}
          />

          <ExportModal
            isOpen={isExportOpen}
            onClose={() => setIsExportOpen(false)}
            username={currentUser}
            monthKey={currentMonthKey}
            dataStore={dataStore}
            installments={installments}
            onImportData={handleImportData}
            showToast={showToast}
          />

          <div>
            <Header
              username={currentUser}
              onLogout={handleLogout}
              onOpenExport={() => setIsExportOpen(true)}
              onLoadDemo={handleLoadDemo}
            />

            <main className="max-w-xl mx-auto p-4 sm:p-5 space-y-4 w-full">
              <PeriodSelector
                currentMonthKey={currentMonthKey}
                onChangeMonth={setCurrentMonthKey}
              />

              <SummaryCards
                totalIncomes={totalIncomes}
                totalTrans={totalTrans}
                totalBills={totalBills}
                totalInstallments={totalInstallments}
                paidBillsTotal={paidBillsTotal}
                paidInstallmentsTotal={paidInstallmentsTotal}
              />

              <IncomeSection
                incomes={currentMonthData.incomes}
                onAddIncome={handleAddIncome}
                onDeleteIncome={handleDeleteIncome}
              />

              <DailyExpenseSection
                transactions={currentMonthData.transactions}
                onAddTransaction={handleAddTransaction}
                onDeleteTransaction={handleDeleteTransaction}
              />

              <MonthlyBillsSection
                bills={currentMonthData.bills}
                onAddBill={handleAddBill}
                onToggleBillPaid={handleToggleBillPaid}
                onDeleteBill={handleDeleteBill}
                onCopyPreviousMonthBills={handleCopyPreviousMonthBills}
                onResetBills={handleResetBills}
              />

              <InstallmentsSection
                installments={installments}
                installmentPaidKeys={currentMonthData.installmentPaidKeys || []}
                onAddInstallment={handleAddInstallment}
                onToggleInstallmentPaid={handleToggleInstallmentPaid}
                onDeleteInstallment={handleDeleteInstallment}
              />
            </main>
          </div>

          <footer className="text-center text-xs text-slate-400 py-6 border-t border-slate-200/60 mt-8">
            <p className="font-semibold text-slate-500">BudgetingKU &copy; {new Date().getFullYear()}</p>
            <p className="text-[11px] text-slate-400 mt-0.5">Kelola Keuangan Pribadi, Tagihan Rutin & Cicilan Berjangka</p>
          </footer>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
